services:
  api:
    build:
      context: ./backend/FileExplorer.Api
    container_name: file-explorer-api
    restart: unless-stopped
    # Required for the mount/unmount feature: the API shells out to `nsenter --target 1 ...` to run
    # mount/umount inside the host's own namespaces (PID 1's), since a plain `mount` here would only
    # affect this container's private mount namespace and never reach the real host. `privileged: true`
    # grants the capabilities nsenter needs (CAP_SYS_ADMIN, /dev access); `pid: host` gives it a PID 1
    # to target. See README.md's Architecture section for the security implications.
    privileged: true
    pid: host
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in your .env file - see .env.example}
      Admin__Username: ${ADMIN_USERNAME:-admin}
      # Leave ADMIN_PASSWORD unset on first run to get a random password logged once at startup.
      Admin__Password: ${ADMIN_PASSWORD:-admin}
    volumes:
      - fx-data:/data
      # Bind-mounts the whole host filesystem in as the app's "root". `rslave` propagation
      # means drives mounted on the host *after* this container starts (e.g. a plugged-in
      # USB drive) still show up without a restart. Adjust/narrow this for your own host -
      # see README.md for alternative, more restrictive mount layouts.
      # - ./test:/test
      - type: bind
        source: ./test
        target: /host_root
        bind:
          propagation: rslave

  web:
    build:
      context: ./frontend
    container_name: file-explorer-web
    restart: unless-stopped
    ports:
      - "7766:80"
    depends_on:
      - api

volumes:
  fx-data:
