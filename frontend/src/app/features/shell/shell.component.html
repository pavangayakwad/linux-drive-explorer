<div class="shell" [style.grid-template-columns]="sidebarWidth() + 'px 5px 1fr'">
  <app-sidebar
    class="shell__sidebar"
    [drives]="drives()"
    [unmountedDevices]="unmountedDevices()"
    [currentPath]="currentPath()"
    [refreshingDrives]="refreshingDrives()"
    [mountingDevice]="mountingDevice()"
    [unmountingPath]="unmountingPath()"
    [runningTaskCount]="runningTaskCount()"
    (navigate)="onNavigate($event)"
    (refreshDrives)="refreshDrives()"
    (mountDevice)="mountDevice($event)"
    (unmountDrive)="unmountDrive($event)"
  />
  <div class="shell__resizer" (mousedown)="startResize($event)"></div>
  <div class="shell__main">
    <router-outlet />
  </div>
</div>

<app-upload-progress-panel />
