<div class="trash-page">
  <div class="trash-page__header">
    <h1>Trash</h1>
    <span class="trash-page__spacer"></span>
    @if (selection().length > 0) {
      <p-button label="Delete selected" icon="pi pi-trash" severity="danger" [text]="true" (onClick)="confirmPurgeSelected()" />
    }
    <p-button label="Empty trash" icon="pi pi-trash" severity="danger" [disabled]="items().length === 0" (onClick)="confirmEmptyTrash()" />
    <p-button icon="pi pi-refresh" [text]="true" (onClick)="refresh()" pTooltip="Refresh" />
  </div>

  <p-table
    [value]="items()"
    [loading]="loading()"
    [(selection)]="selection"
    dataKey="id"
    [size]="'small'"
  >
    <ng-template pTemplate="header">
      <tr>
        <th style="width: 2.5rem"><p-tableHeaderCheckbox /></th>
        <th>Name</th>
        <th>Original location</th>
        <th style="width: 7rem">Size</th>
        <th style="width: 11rem">Deleted</th>
        <th style="width: 6rem"></th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
      <tr>
        <td><p-tableCheckbox [value]="item" /></td>
        <td>
          <i [class]="item.isDirectory ? 'pi pi-folder file-icon file-icon--folder' : 'pi pi-file file-icon'"></i>
          {{ item.name }}
        </td>
        <td class="trash-page__muted">{{ item.originalPath }}</td>
        <td>{{ item.sizeBytes !== null ? formatBytes(item.sizeBytes) : '' }}</td>
        <td>{{ formatDateTime(item.deletedAt) }}</td>
        <td>
          <p-button icon="pi pi-replay" [text]="true" (onClick)="restore(item)" pTooltip="Restore" />
        </td>
      </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="6" class="trash-page__empty">Trash is empty.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
